<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: Georgia, 'Times New Roman', serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #ffffff; padding: 40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="background-color: #111010; border: 1px solid #1e1b18; border-top: 1px solid rgba(196, 168, 130, 0.2); border-radius: 4px; padding: 40px;">
          <tr>
            <td align="center" style="padding-bottom: 30px;">
              <h1 style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: 400; letter-spacing: 8px; color: #C4A882;">ZULE</h1>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom: 24px;">
              <p style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 16px; color: #ece8e1; line-height: 1.6;">
                A password reset was requested for your account.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom: 32px;">
              <a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #C4A882; color: #080706; font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: 600; letter-spacing: 2px; text-decoration: none; padding: 14px 32px; border-radius: 4px;">RESET PASSWORD</a>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top: 16px; border-top: 1px solid #1e1b18;">
              <p style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 12px; color: #4a453e; line-height: 1.6;">
                If you didn't request this, ignore this email. Your password will not change.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
