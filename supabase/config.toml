# Supabase local configuration

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "https://zule.mazzizax.net"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
jwt_issuer = "http://127.0.0.1:54321/auth/v1"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_manual_linking = false
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = ""
signing_keys_path = ""
publishable_key = ""

[auth.sessions]
timebox = 0
inactivity_timeout = 0

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600
[auth.email.template.confirmation]
subject = "Verify your email"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"
[auth.email.template.invite]
subject = "You've been invited to Zule"
content_path = "./supabase/templates/invite.html"
[auth.email.template.magic_link]
subject = "Sign in to Zule"
content_path = "./supabase/templates/magic_link.html"
[auth.email.template.email_change]
subject = "Confirm your new email"
content_path = "./supabase/templates/email_change.html"
[auth.email.notification]

[auth.sms]
[auth.sms.test_otp]

[auth.mfa]
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false

[auth.external]

[auth.third_party]

[auth.hook]
[auth.hook.mfa_verification_attempt]
[auth.hook.password_verification_attempt]
[auth.hook.custom_access_token]
[auth.hook.send_sms]
[auth.hook.send_email]

[functions.passkey-register]
# New sb_publishable_ keys not compatible with Edge JWT verification - verify inside function
verify_jwt = false

[functions.passkey-auth]
# Allow unauthenticated access - this endpoint validates via credential_id, not JWT
verify_jwt = false

[functions.mint-session]
# Allow unauthenticated access - this endpoint validates via verification_token
verify_jwt = false

[functions.issue-attestation]
# New sb_publishable_ keys not compatible with Edge JWT verification - verify inside function via JWKS
verify_jwt = false

[functions.plaid-create-link-token]
# New sb_publishable_ keys not compatible with Edge JWT verification - verify inside function
verify_jwt = false

[functions.plaid-exchange-token]
# New sb_publishable_ keys not compatible with Edge JWT verification - verify inside function
verify_jwt = false

[functions.plaid-pull-transactions]
# New sb_publishable_ keys not compatible with Edge JWT verification - verify inside function
verify_jwt = false

[functions.plaid-update-link-token]
# New sb_publishable_ keys not compatible with Edge JWT verification - verify inside function
verify_jwt = false

[functions.plaid-webhook]
# Plaid signs webhooks with its own JWT signature, not Supabase JWT
verify_jwt = false

[functions.stripe-webhook]
# Stripe signs webhooks with its own signature, not JWT
verify_jwt = false

[functions.create-checkout]
# Requires authenticated user
verify_jwt = true

[functions.create-portal-session]
# Requires authenticated user
verify_jwt = true

[functions.create-payment]
# Requires authenticated user
verify_jwt = true

[functions.create-verification-session]
# Requires authenticated user
verify_jwt = true
